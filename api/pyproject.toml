[project]
name = "gemmacademy-api"
version = "0.1.0"
description = "FastAPI service that drives the Gemmacademy Phase 2 training pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.9",
    "requests>=2.32",
    "huggingface-hub>=0.26",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false
